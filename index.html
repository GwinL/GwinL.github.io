<!DOCTYPE html>
<html lang="zh-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frequency Match ｜ Gwin 的徵友互動</title>

  <!-- Tailwind CSS & Lucide Icons & Canvas Confetti -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <!-- 引入自訂樣式 -->
  <link rel="stylesheet" href="style.css">
</head>

<body class="min-h-screen flex flex-col antialiased">

  <!-- 頂部深藍導覽列 -->
  <header class="sticky top-0 z-30 bg-slate-900 border-b border-slate-800 text-white shadow-sm">
    <div class="max-w-xl mx-auto px-4 h-14 flex items-center justify-between">

      <div class="flex items-center space-x-2.5">
        <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center text-white">
          <i data-lucide="sparkles" class="w-4 h-4"></i>
        </div>

        <span
          class="font-bold tracking-tight text-sm sm:text-base"
          id="header-title">
          Frequency Match
        </span>
      </div>

      <div
        class="text-xs text-slate-400 font-mono"
        id="header-status">
        自介探索
      </div>

    </div>
  </header>


  <!-- 主內容容器 -->
  <main class="flex-1 max-w-xl w-full mx-auto px-4 py-8">


    <!-- 1. 自我介紹頁 -->
    <div id="page-intro" class="space-y-6 animate-step">

      <section class="ui-card p-6 sm:p-8 space-y-6">


      <!-- 頭像與基本資料 -->
<div class="space-y-5">

  <!-- 頭像 / 名字 / 地區 -->
  <div class="flex items-center gap-4">

    <img
      id="intro-avatar"
      src=""
      alt="Avatar"
      class="w-20 h-20 sm:w-24 sm:h-24 rounded-2xl object-cover border-2 border-slate-100 shadow-md shrink-0">

    <div class="flex-1">

      <h1
        class="text-2xl font-extrabold tracking-tight text-slate-900"
        id="intro-name">
      </h1>

      <div class="flex items-center gap-1.5 text-xs mt-2">

        <span
          class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded border border-slate-200"
          id="intro-location">
        </span>

      </div>

    </div>

  </div>

  <!-- Bio -->
  <p
    class="text-slate-600 text-base leading-relaxed whitespace-pre-line text-left"
    id="intro-bio">
  </p>

  <!-- 標籤 -->
  <div
    class="flex flex-wrap gap-1.5 pt-1 justify-start"
    id="intro-tags">
  </div>

</div>


        <!-- Good / Bad / Red Flags -->
        <div class="pt-5 border-t border-slate-100 space-y-3 text-xs">


          <!-- Good Points -->
          <div class="bg-emerald-50/70 p-4 rounded-xl border border-emerald-100">

            <span class="text-emerald-900 font-bold block mb-2 text-sm">
              ✨ 我的優點 / 希望妳也是這樣的人
            </span>

            <span
              class="text-emerald-800 text-sm sm:text-base leading-relaxed whitespace-pre-line"
              id="intro-good">
            </span>

          </div>


          <!-- Bad Points -->
          <div class="bg-amber-50/70 p-4 rounded-xl border border-amber-100">

            <span class="text-amber-900 font-bold block mb-2 text-sm">
              ⚠️ 我的缺點 / 可能會讓妳不喜歡我的地方
            </span>

            <span
              class="text-amber-800 text-sm sm:text-base leading-relaxed whitespace-pre-line"
              id="intro-bad">
            </span>

          </div>


          <!-- Red Flags -->
          <div class="bg-rose-50/70 p-4 rounded-xl border border-rose-100">

            <span class="text-rose-900 font-bold block mb-2 text-sm">
              🚩 我的雷點 / 我比較難接受的特質
            </span>

            <span
              class="text-rose-800 text-sm sm:text-base leading-relaxed whitespace-pre-line"
              id="intro-red">
            </span>

          </div>

        </div>



        <!-- 開始按鈕 -->
        <div class="pt-2">

          <button
            onclick="startQuiz()"
            class="w-full py-3.5 px-4 bg-blue-700 hover:bg-blue-800 text-white font-bold text-sm sm:text-base rounded-xl transition shadow-md flex items-center justify-center gap-2">

            <span id="start-btn-text">
              開始互動（共 11 題）
            </span>

            <i
              data-lucide="arrow-right"
              class="w-4 h-4">
            </i>

          </button>

        </div>

      </section>

    </div>



    <!-- 2. 題目選項作答頁 -->
    <div
      id="page-question"
      class="hidden space-y-6 animate-step">

      <section class="ui-card p-6 sm:p-7 space-y-6">


        <!-- 題號與進度 -->
        <div class="space-y-1.5">

          <div class="flex items-center justify-between text-xs font-semibold">

            <span class="text-blue-700 flex items-center gap-1.5">

              <span class="w-2 h-2 rounded-full bg-blue-600 animate-pulse">
              </span>

              <span id="q-counter">
                Question 1 / 11
              </span>

            </span>


            <span
              class="text-slate-400 font-mono"
              id="q-category">
            </span>

          </div>


          <div class="w-full bg-slate-100 h-1.5 rounded-full overflow-hidden">

            <div
              id="q-progress-bar"
              class="bg-blue-600 h-full w-0 transition-all duration-300">
            </div>

          </div>

        </div>



        <!-- 題目 -->
        <div class="space-y-1.5">

          <h2
            class="text-base sm:text-lg font-bold text-slate-900 leading-snug"
            id="q-title">
          </h2>

          <p
            class="text-xs text-slate-500"
            id="q-desc">
          </p>

        </div>


        <!-- 選項 -->
        <div
          id="q-options"
          class="space-y-2.5">
        </div>

      </section>

    </div>



    <!-- 3. 我的答案揭曉頁 -->
    <div
      id="page-reveal"
      class="hidden space-y-6 animate-step">

      <section class="ui-card p-6 sm:p-7 space-y-6">


        <div class="flex items-center justify-between border-b border-slate-100 pb-3">

          <span
            class="text-xs font-mono font-bold px-2 py-0.5 rounded bg-blue-100 text-blue-800"
            id="reveal-q-badge">
            Q1 解鎖
          </span>

          <span class="text-xs text-slate-400">
            關於這題
          </span>

        </div>



        <!-- 對方選擇 -->
        <div class="p-3.5 rounded-xl bg-slate-50 border border-slate-200 space-y-1">

          <div class="text-[11px] font-bold text-slate-500">
            妳的選擇：
          </div>

          <div
            class="text-base font-semibold text-slate-800"
            id="user-choice-text">
          </div>

        </div>



    <!-- 我的答案 -->
<div class="p-4 rounded-xl bg-blue-50/80 border border-blue-200 space-y-2.5">

  <div class="flex items-center gap-2">

    <span
      class="shrink-0 whitespace-nowrap self-start px-2.5 py-1 rounded-md bg-blue-600 text-white text-[11px] font-bold">
      我的答案
    </span>

    <span
      class="text-base font-extrabold text-blue-950"
      id="my-choice-text">
    </span>

  </div>

  <p
    class="text-sm sm:text-base text-slate-700 leading-relaxed bg-white/90 p-3 rounded-lg border border-blue-100 whitespace-pre-line"
    id="my-choice-note">
  </p>

  <img
    id="my-choice-image"
    src=""
    alt="我的分享圖片"
    class="hidden w-full mt-3 rounded-xl border border-slate-200 shadow-sm object-cover">

</div>


        <!-- 下一題 -->
        <div class="pt-2">

          <button
            onclick="handleNextClick()"
            class="w-full py-3.5 px-4 bg-blue-700 hover:bg-blue-800 text-white font-bold text-sm rounded-xl transition shadow flex items-center justify-center gap-2">

            <span id="next-step-btn-text">
              下一題
            </span>

            <i
              data-lucide="arrow-right"
              class="w-4 h-4">
            </i>

          </button>

        </div>

      </section>

    </div>



    <!-- 4. 作答完畢聯絡卡 -->
    <div
      id="page-contact"
      class="hidden space-y-6 animate-step">

      <section class="ui-card p-6 sm:p-7 space-y-5">


        <div class="text-center space-y-1">

          <div
            class="w-12 h-12 rounded-full bg-blue-50 text-blue-700 flex items-center justify-center mx-auto mb-2 border border-blue-200">

            <i
              data-lucide="award"
              class="w-6 h-6">
            </i>

          </div>


          <h2 class="text-lg font-bold text-slate-900">
            11 題全部完成 🎆
          </h2>

          <p class="text-xs text-slate-500">
            留下稱呼與聯絡方式，並送出回答！
          </p>

        </div>



        <!-- 聯絡資料 -->
        <div class="space-y-3 pt-2">


          <!-- 名字 -->
          <div>

            <label class="block text-xs font-semibold text-slate-700 mb-1">

              任何妳覺得可以的名字

              <span class="text-rose-500">
                *
              </span>

            </label>


            <input
              type="text"
              id="resp-name"
              placeholder="例如：Jamie"
              class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white">

          </div>



          <!-- 聯絡方式 -->
          <div>

            <label class="block text-xs font-semibold text-slate-700 mb-1">

              聯絡方式

              <span class="text-rose-500">
                *
              </span>

            </label>


            <input
              type="text"
              id="resp-contact"
              placeholder="@instagram_id 或 @thread_id"
              class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white">

          </div>



          <!-- 留言 -->
          <div>

            <label class="block text-xs font-semibold text-slate-700 mb-1">
              有什麼想和我說的嗎？（選填）
            </label>


            <input
              type="text"
              id="resp-note"
              placeholder="可以寫自我介紹、想法或想吐槽的題目 😂"
              class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl text-xs sm:text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white">

          </div>

        </div>



        <!-- 送出 -->
        <button
          onclick="submitFinalAnswers()"
          class="w-full py-3 bg-blue-700 hover:bg-blue-800 text-white font-bold text-xs sm:text-sm rounded-xl transition shadow flex items-center justify-center gap-2">

          <i
            data-lucide="send"
            class="w-4 h-4">
          </i>

          <span>
            傳送結果
          </span>

        </button>


        <p
          id="submit-feedback"
          class="text-xs text-slate-500 mt-1">
        </p>

      </section>

    </div>



    <!-- 5. 結算與破冰卡 -->
    <div
      id="page-result"
      class="hidden space-y-6 animate-step">

      <section class="ui-card p-6 sm:p-7 text-center space-y-5 border-2 border-blue-600/30">


        <div
          class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-blue-50 border border-blue-200 text-blue-600 mx-auto">

          <i
            data-lucide="check"
            class="w-8 h-8">
          </i>

        </div>



        <div>

          <h3 class="text-lg font-bold text-slate-900">
            完成！
          </h3>

          <p
            class="text-xs text-slate-500 mt-1"
            id="submit-feedback-result">
            作答完成。
          </p>

        </div>



        <!-- 破冰訊息 -->
        <div class="bg-slate-50 p-4 rounded-xl text-left border border-slate-200 space-y-2.5">

          <div class="text-xs text-slate-600 font-semibold">
            專屬訊息卡：
          </div>

          <div class="text-xs text-slate-500">
            如果妳覺得我們蠻聊得來，可以把這段複製後私訊我，再加上一點妳自己的自我介紹。
          </div>


          <p
            class="text-xs text-slate-800 font-mono bg-white p-3 rounded-lg border border-slate-200 leading-relaxed"
            id="icebreaker-msg">
          </p>


          <button
            onclick="copyIcebreakerMessage()"
            class="w-full py-2.5 bg-slate-900 hover:bg-slate-800 text-white rounded-lg text-xs font-semibold transition flex items-center justify-center gap-1.5">

            <i
              data-lucide="copy"
              class="w-3.5 h-3.5">
            </i>

            <span id="copy-btn-label">
              一鍵複製我是誰
            </span>

          </button>

        </div>

      </section>

    </div>


  </main>


  <!-- 依序載入設定與應用邏輯 -->
  <script src="config.js"></script>
  <script src="app.js"></script>

</body>

</html>
